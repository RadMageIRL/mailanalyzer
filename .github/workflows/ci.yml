# Deploys the site to GitHub Pages on every push to main; radmagelabs.com/mailanalyzer/ proxies that copy. The tests
# run locally before a push (README, Development), not here. Needs the repository's Pages source set to
# "GitHub Actions".
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the site files
        run: node tools/build.mjs
      # The same commit builds the same bytes anywhere, so this list can be compared with a local build.
      - name: SHA-256 of every deployed file
        run: cd dist/site && sha256sum *
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v5
